  - type: Documentation
    url: https://shopify.dev/docs/api/storefront
- name: Slingshot Bio Content Lake GROQ API
  description: 'The Sanity Content Lake GROQ query API for the Slingshot Bio editorial
    surface — pages, resources, blog posts, press releases, product sheets and webinars
    — declared by the company in its own /.well-known/api-catalog. The production dataset
    answers anonymous GROQ queries over HTTPS GET.'
  humanURL: https://www.slingshotbio.com/resources/blog
  baseURL: https://9l0m1rv5.api.sanity.io/v2025-08-29/data/query/production
  tags:
  - Content
  - CMS
  - GROQ
  properties:
  - type: Documentation
    url: https://www.sanity.io/docs/http-query
- name: Slingshot Bio Storefront MCP Server
  description: 'A live Model Context Protocol server for the Slingshot Bio store, answering
    anonymous tools/list over HTTP JSON-RPC with five tools: search_catalog, get_product_details,
    get_cart, update_cart and search_shop_policies_and_faqs. Customer-scoped operations
    are protected by the OAuth 2.0 authorization server advertised at /.well-known/oauth-protected-resource.'
  humanURL: https://www.slingshotbio.com/
  baseURL: https://slingshot-bio.myshopify.com/api/mcp
  tags:
