aid: slingshot-biosciences
name: Slingshot Biosciences
description: 'Slingshot Biosciences is an Emeryville, California biotechnology company
  that engineers synthetic cell mimics — hydrogel-based particles that behave like
  real cells — as reproducible reference materials and controls for flow cytometry,
  spectral unmixing, immunophenotyping, cell and gene therapy potency assays, and instrument
  standardization. Its product families include TruCytes biomarker controls, ViaComp
  cell health controls, FlowCytes and ScatterBridge calibration controls, SpectraComp
  compensation and unmixing controls, QuantCytes quantitation controls and StimCytes
  functional controls. The company sells direct through a Shopify-backed storefront
  and publishes an unusually complete agent-facing surface for a life-sciences vendor:
  an llms.txt, an RFC 9727 /.well-known/api-catalog naming its Shopify Storefront GraphQL
  and Sanity Content Lake GROQ endpoints, content negotiation that serves markdown
  twins of every canonical page to agents that send Accept: text/markdown, and a live
  Shopify Storefront MCP server.'
