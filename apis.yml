apis:
- name: Slingshot Bio Storefront GraphQL API
  description: 'The Shopify Storefront GraphQL API for the Slingshot Bio online store,
    declared by the company in its own /.well-known/api-catalog. Serves products, collections,
    cart and checkout operations for the cell mimic catalog. Introspection is open
    anonymously; the schema carries 428 types, 35 query fields and 40 mutations.'
  humanURL: https://www.slingshotbio.com/collections
