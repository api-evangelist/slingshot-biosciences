tools:
- name: search_catalog
  description: Search for products from the online store using natural language queries, specific filter
    criteria, or both. At least one of query or filters must be provided. Results are paginated.
  input_properties:
  - meta
  - catalog
  required: []
- name: get_product_details
  description: Look up a product by ID. Pass the options parameter to select a specific variant for the
    product card; without options the first available variant is returned.
  input_properties:
  - product_id
  - options
  - country
  - language
  required:
  - product_id
- name: get_cart
  description: Get the cart including items, shipping options, discount info and checkout URL for a given
    cart id.
  input_properties:
  - cart_id
  required:
  - cart_id
- name: update_cart
  description: Consolidated cart update — add/remove/update line items, buyer information, shipping details,
    discount codes, gift cards and notes in one call. When creating a new cart only add_items is required.
  input_properties:
  - cart_id
  - add_items
  - update_items
  - remove_line_ids
  - buyer_identity
  - delivery_addresses_to_add
  - delivery_addresses_to_replace
  - selected_delivery_options
  - discount_codes
  - gift_card_codes
  - note
  required: []
- name: search_shop_policies_and_faqs
  description: Answer factual questions about the store's policies, products or services — return policy,
    shipping policy, phone number, hours of operation.
  input_properties:
  - query
  - context
  required:
  - query
