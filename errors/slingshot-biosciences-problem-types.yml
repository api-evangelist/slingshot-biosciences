    {"error":{"description":"unexpected end-of-file, expected expression","end":9,
    "query":"*[_type==","start":9,"type":"queryParseError"}}
- surface: website
  endpoint: https://www.slingshotbio.com
  format: HTML
  http_status_on_error: 404
  note: >-
    Unknown paths return a genuine 404 with an HTML body. A control probe of
