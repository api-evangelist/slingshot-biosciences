  application/problem+json.

envelopes:
- surface: storefront-graphql
  endpoint: https://slingshot-bio.myshopify.com/api/2026-07/graphql.json
  format: GraphQL errors[]
  http_status_on_error: 200
  fields: [message, locations, path, extensions.code, extensions.typeName, extensions.fieldName]
  observed_example: >-
    {"errors":[{"message":"Field 'nonexistentField' doesn't exist on type
    'QueryRoot'","locations":[{"line":1,"column":2}],"path":["query","nonexistentField"],
    "extensions":{"code":"undefinedField","typeName":"QueryRoot","fieldName":"nonexistentField"}}]}
  note: >-
    Errors are returned with HTTP 200 in GraphQL fashion; agents must inspect the
    errors[] array rather than the status line. Mutation-level failures are
    additionally returned as typed userErrors payloads on the mutation result
    (CartUserError, CustomerUserError, MetafieldsSetUserError and siblings are all
    present in the introspected schema).
